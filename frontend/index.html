<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Shared styles for the themed background and glowing inputs */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(220, 38, 38, 0.4); }
            50% { box-shadow: 0 0 25px rgba(220, 38, 38, 0.7); }
        }
        .input-glow-persistent { animation: pulse-glow 3s infinite ease-in-out; }
        .themed-background {
             background-color: #110d0d;
             background-image:
                radial-gradient(at 0% 100%, hsla(0, 40%, 15%, 1) 0px, transparent 50%),
                radial-gradient(at 90% 10%, hsla(350, 40%, 15%, 1) 0px, transparent 50%);
        }
        /* Custom styles for range input */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 20px; height: 20px;
            background: #DC2626; cursor: pointer; border-radius: 50%;
        }
        input[type="range"]::-moz-range-thumb {
            width: 20px; height: 20px; background: #DC2626;
            cursor: pointer; border-radius: 50%;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 font-sans themed-background">

    <div id="main-app">
        <nav class="bg-gray-800/80 backdrop-blur-sm border-b border-gray-700 sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                  <span class="font-bold text-xl text-white">Attendance Tracker</span>
                </div>
                <div class="hidden md:block">
                  <div class="ml-10 flex items-baseline space-x-4">
                    <button data-page="timetable" class="nav-button capitalize px-3 py-2 rounded-md text-sm font-medium transition-colors bg-gray-900 text-white">Timetable</button>
                    <button data-page="report" class="nav-button capitalize px-3 py-2 rounded-md text-sm font-medium transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">Report</button>
                    <button data-page="calculator" class="nav-button capitalize px-3 py-2 rounded-md text-sm font-medium transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">Calculator</button>
                    <button data-page="upload" class="nav-button capitalize px-3 py-2 rounded-md text-sm font-medium transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">Upload</button>
                  </div>
                </div>
                <div>
                  <button id="logout-button" class="px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:bg-red-600 hover:text-white transition-colors">
                    Logout
                  </button>
                </div>
              </div>
            </div>
        </nav>
        <main id="main-content">
            </main>
    </div>

    <div id="edit-lecture-modal" class="hidden fixed inset-0 bg-black/60 items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-gray-800 rounded-2xl p-8 border border-gray-700 w-full max-w-md m-4">
            <h2 class="text-2xl font-bold text-white mb-6" id="modal-title">Edit Lecture</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-sm font-medium text-gray-400 block mb-2">Subject</label>
                    <input type="text" id="modal-subject" class="w-full p-3 text-white bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-red-500 outline-none input-glow-persistent" />
                </div>
                <div>
                    <label class="text-sm font-medium text-gray-400 block mb-2">Time (e.g., 09:00 - 10:00)</label>
                    <input type="text" id="modal-time" class="w-full p-3 text-white bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-red-500 outline-none input-glow-persistent" />
                </div>
            </div>
            <div class="mt-8 flex justify-end space-x-4">
                <button id="modal-cancel" class="px-4 py-2 font-semibold text-gray-300 bg-gray-700 rounded-lg hover:bg-gray-600 transition">Cancel</button>
                <button id="modal-save" class="px-4 py-2 font-semibold text-white bg-red-600 rounded-lg hover:bg-red-700 transition">Save Changes</button>
            </div>
        </div>
    </div>
    
    <div id="delete-confirm-modal" class="hidden fixed inset-0 bg-black/60 items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-gray-800 rounded-2xl p-8 border border-gray-700 w-full max-w-sm m-4">
            <h2 class="text-xl font-bold text-white mb-4">Are you sure?</h2>
            <p class="text-gray-400 mb-6">This action will permanently delete the lecture from your timetable.</p>
            <div class="flex justify-end space-x-4">
                <button id="delete-cancel" class="px-4 py-2 font-semibold text-gray-300 bg-gray-700 rounded-lg hover:bg-gray-600 transition">Cancel</button>
                <button id="delete-confirm" class="px-4 py-2 font-semibold text-white bg-red-600 rounded-lg hover:bg-red-700 transition">Confirm Delete</button>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {

        // AUTHENTICATION CHECK: Redirect to login if not logged in
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'login.html';
            return; // Stop executing script if not logged in
        }

        // --- DATA STORE ---
        let timetableData;
        const defaultTimetableData = {
          Monday: [
            { id: 'mon-1', time: '09:00 - 10:00', subject: 'Quantum Physics', status: 'Scheduled' },
            { id: 'mon-2', time: '10:00 - 11:00', subject: 'Data Structures', status: 'Scheduled' },
          ],
          Tuesday: [{ id: 'tue-1', time: '10:00 - 11:00', subject: 'Web Development', status: 'Scheduled' }],
          Wednesday: [{ id: 'wed-1', time: '11:00 - 12:00', subject: 'Machine Learning', status: 'Scheduled' }],
          Thursday: [{ id: 'thu-1', time: '09:00 - 10:00', subject: 'Quantum Physics', status: 'Scheduled' }],
          Friday: [{ id: 'fri-1', time: '10:00 - 11:00', subject: 'Data Structures', status: 'Scheduled' }],
          Saturday: [],
          Sunday: [],
        };
        
        // --- PERSISTENCE FUNCTIONS ---
        function loadData() {
            const savedData = localStorage.getItem('attendanceTrackerData');
            if (savedData) {
                timetableData = JSON.parse(savedData);
            } else {
                timetableData = defaultTimetableData;
            }
        }

        function saveData() {
            localStorage.setItem('attendanceTrackerData', JSON.stringify(timetableData));
        }

        // --- STATE MANAGEMENT ---
        let currentPage = 'timetable';
        let editingLectureInfo = null;
        let deletingLectureInfo = null;
        let isTimetableEditMode = false;

        // --- DOM ELEMENTS ---
        const mainContent = document.getElementById('main-content');
        const navButtons = document.querySelectorAll('.nav-button');

        // --- TEMPLATES (HTML GENERATORS) ---
        const getTimetableHTML = () => {
            const daysOfWeek = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
            const getStatusColor = (status) => {
              switch (status) {
                case 'Present': return 'bg-green-500/20 text-green-300 border-green-500/30';
                case 'Absent': return 'bg-red-500/20 text-red-300 border-red-500/30';
                case 'Cancelled': return 'bg-yellow-500/20 text-yellow-300 border-yellow-500/30';
                default: return 'bg-gray-800/50 text-gray-400 border-gray-700';
              }
            };
            
            return `
                <div class="p-4 sm:p-6 md:p-8">
                  <div class="flex justify-between items-center mb-6">
                    <h1 class="text-3xl font-bold text-white">Weekly Timetable</h1>
                    <button id="toggle-edit-timetable" class="px-4 py-2 font-semibold text-white ${isTimetableEditMode ? 'bg-green-600 hover:bg-green-700' : 'bg-red-600 hover:bg-red-700'} rounded-lg transition-colors">
                      ${isTimetableEditMode ? 'Save Changes' : 'Edit Timetable'}
                    </button>
                  </div>
                  <div class="overflow-x-auto">
                    <div class="grid grid-cols-5 min-w-[1000px]">
                      ${daysOfWeek.map(day => `
                        <div class="flex flex-col border-l border-gray-700 first:border-l-0">
                          <h2 class="text-xl font-bold text-white text-center py-3 bg-gray-800">${day}</h2>
                          <div class="p-2 space-y-2 bg-gray-800/50 flex-grow min-h-[200px]">
                            ${timetableData[day].length > 0 ? timetableData[day].map(lec => `
                              <div class="p-3 rounded-lg border ${getStatusColor(lec.status)}">
                                <div class="flex items-center mb-2">
                                   <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mr-2 text-gray-400 flex-shrink-0"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                                   <p class="font-mono text-sm text-gray-300 truncate">${lec.time}</p>
                                </div>
                                <div class="flex items-center">
                                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mr-2 text-gray-400 flex-shrink-0"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
                                  <h3 class="font-semibold text-white truncate">${lec.subject}</h3>
                                </div>
                                <div class="flex items-center space-x-2 mt-3">
                                    <select data-day="${day}" data-id="${lec.id}" class="status-select flex-grow w-full bg-gray-700/80 text-white border border-gray-600 rounded-md py-1 px-2 focus:ring-2 focus:ring-red-500 outline-none text-sm">
                                      <option value="Scheduled" ${lec.status === 'Scheduled' ? 'selected' : ''}>Scheduled</option>
                                      <option value="Present" ${lec.status === 'Present' ? 'selected' : ''}>Present</option>
                                      <option value="Absent" ${lec.status === 'Absent' ? 'selected' : ''}>Absent</option>
                                      <option value="Cancelled" ${lec.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                                    </select>
                                    ${isTimetableEditMode ? `
                                        <button data-day="${day}" data-id="${lec.id}" class="edit-button p-1.5 text-gray-400 hover:text-white bg-gray-700/80 rounded-md border border-gray-600 hover:bg-gray-600 transition">
                                          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
                                        </button>
                                        <button data-day="${day}" data-id="${lec.id}" class="delete-button p-1.5 text-red-400 hover:text-white bg-gray-700/80 rounded-md border border-gray-600 hover:bg-red-500/50 transition">
                                           <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                                        </button>
                                    ` : ''}
                                </div>
                              </div>
                            `).join('') : '<div class="text-center text-gray-500 p-4 h-full flex items-center justify-center">No classes</div>'}
                            ${isTimetableEditMode ? `
                              <button data-day="${day}" class="add-lecture-button w-full mt-2 flex items-center justify-center p-2 text-sm text-gray-400 hover:text-white hover:bg-gray-700/50 rounded-lg transition-colors">
                                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mr-2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                                  Add Lecture
                              </button>
                            ` : ''}
                          </div>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                </div>
            `;
        };
        
        const getUploadHTML = () => `
            <div class="p-4 sm:p-6 md:p-8">
              <h1 class="text-3xl font-bold text-white mb-6">Upload Timetable</h1>
              <div class="bg-gray-800 border-2 border-dashed border-gray-600 rounded-2xl p-8 text-center flex flex-col items-center justify-center min-h-[300px]">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-16 h-16 text-gray-500 mb-4"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="M12 12v9"></path><path d="m16 16-4-4-4 4"></path></svg>
                <label for="file-upload" class="cursor-pointer font-semibold text-red-400 hover:text-red-300">
                  <span>Upload a PDF file</span>
                  <input id="file-upload" name="file-upload" type="file" class="sr-only" accept=".pdf">
                </label>
                <p class="mt-2 text-xs text-gray-500" id="file-name-display">No file selected</p>
              </div>
              <div class="mt-8 text-center hidden" id="process-button-container">
                <button id="process-button" class="px-8 py-3 font-semibold text-white bg-red-600 rounded-lg hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-red-500 transition duration-200">
                  Process Timetable
                </button>
              </div>
            </div>
        `;

        const getReportHTML = () => {
            let lecturesHappened = 0, present = 0, absent = 0, cancelled = 0, overallScheduled = 0;
            Object.values(timetableData).forEach(day => day.forEach(lec => {
                overallScheduled++;
                if(lec.status !== 'Scheduled' && lec.status !== 'Cancelled') lecturesHappened++;
                if(lec.status === 'Present') present++;
                if(lec.status === 'Absent') absent++;
                if(lec.status === 'Cancelled') cancelled++;
            }));
            const percentage = lecturesHappened > 0 ? (present / lecturesHappened) * 100 : 0;
            const color = percentage >= 75 ? 'text-green-400' : percentage >= 50 ? 'text-yellow-400' : 'text-red-400';
            const bgColor = percentage >= 75 ? 'bg-green-500' : percentage >= 50 ? 'bg-yellow-500' : 'bg-red-500';

            return `
                <div class="p-4 sm:p-6 md:p-8">
                    <h1 class="text-3xl font-bold text-white mb-6">Attendance Report</h1>
                     <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <div class="md:col-span-2 lg:col-span-3 bg-gray-800 p-6 rounded-2xl border border-gray-700">
                           <div class="flex justify-between items-center mb-2">
                             <h3 class="text-gray-400 text-sm font-medium">Overall Attendance</h3>
                             <span class="font-bold text-lg ${color}">${percentage.toFixed(1)}%</span>
                           </div>
                           <div class="w-full bg-gray-700 rounded-full h-2.5">
                             <div class="${bgColor} h-2.5 rounded-full" style="width: ${percentage}%"></div>
                           </div>
                        </div>
                        <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700"><h3 class="text-gray-400 text-sm font-medium">Total Scheduled</h3><p class="text-3xl font-bold text-white mt-2">${overallScheduled}</p></div>
                        <div class="bg-gray-800 p-6 rounded-2xl border border-green-500/30"><h3 class="text-green-300 text-sm font-medium">Present</h3><p class="text-3xl font-bold text-white mt-2">${present}</p></div>
                        <div class="bg-gray-800 p-6 rounded-2xl border border-red-500/30"><h3 class="text-red-300 text-sm font-medium">Absent</h3><p class="text-3xl font-bold text-white mt-2">${absent}</p></div>
                    </div>
                </div>
            `;
        };

        const getCalculatorHTML = () => `
            <div class="p-4 sm:p-6 md:p-8 flex items-center justify-center">
              <div class="w-full max-w-lg">
                <h1 class="text-3xl font-bold text-white mb-6 text-center">Attendance Calculator</h1>
                <div class="bg-gray-800 p-8 rounded-2xl border border-gray-700 space-y-6">
                  <div>
                    <label class="text-sm font-medium text-gray-400 block mb-2">Total Classes Held</label>
                    <input type="number" id="calc-total" class="w-full p-3 text-white bg-gray-700/50 border border-gray-600 rounded-lg" />
                  </div>
                  <div>
                    <label class="text-sm font-medium text-gray-400 block mb-2">Classes Attended</label>
                    <input type="number" id="calc-attended" class="w-full p-3 text-white bg-gray-700/50 border border-gray-600 rounded-lg" />
                  </div>
                   <div>
                    <label class="text-sm font-medium text-gray-400 block mb-2">Required Percentage: <span id="req-percent-display">75</span>%</label>
                    <input type="range" id="calc-required" min="1" max="100" value="75" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer" />
                  </div>
                  <button id="calc-button" class="w-full py-3 font-semibold text-white bg-red-600 rounded-lg hover:bg-red-700">
                    Calculate
                  </button>
                  <div id="calc-result" class="hidden p-4 rounded-lg text-center border"></div>
                </div>
              </div>
            </div>
        `;

        // --- RENDER FUNCTION ---
        const renderPage = () => {
            switch (currentPage) {
                case 'timetable': mainContent.innerHTML = getTimetableHTML(); break;
                case 'report': mainContent.innerHTML = getReportHTML(); break;
                case 'calculator': mainContent.innerHTML = getCalculatorHTML(); break;
                case 'upload': mainContent.innerHTML = getUploadHTML(); break;
            }
            attachDynamicEventListeners();
        };
        
        // --- NAVIGATION & PAGE DISPLAY ---
        const showPage = (page) => {
            currentPage = page;
            navButtons.forEach(btn => {
                btn.classList.toggle('bg-gray-900', btn.dataset.page === page);
                btn.classList.toggle('text-white', btn.dataset.page === page);
                btn.classList.toggle('text-gray-300', btn.dataset.page !== page);
                btn.classList.toggle('hover:bg-gray-700', btn.dataset.page !== page);
            });
            renderPage();
        };

        // --- DYNAMIC EVENT LISTENERS ---
        function attachDynamicEventListeners() {
            if(currentPage === 'timetable') {
                document.getElementById('toggle-edit-timetable').addEventListener('click', handleToggleEditMode);
                document.querySelectorAll('.status-select').forEach(el => el.addEventListener('change', handleStatusChange));
                
                if(isTimetableEditMode) {
                    document.querySelectorAll('.edit-button').forEach(el => el.addEventListener('click', handleEditClick));
                    document.querySelectorAll('.delete-button').forEach(el => el.addEventListener('click', handleDeleteClick));
                    document.querySelectorAll('.add-lecture-button').forEach(el => el.addEventListener('click', handleAddClick));
                }
            }
            if(currentPage === 'upload') {
                document.getElementById('file-upload').addEventListener('change', handleFileChange);
                const processBtn = document.getElementById('process-button');
                if (processBtn) processBtn.addEventListener('click', () => showPage('timetable'));
            }
            if(currentPage === 'calculator') {
                document.getElementById('calc-button').addEventListener('click', calculateAttendance);
                document.getElementById('calc-required').addEventListener('input', (e) => {
                    document.getElementById('req-percent-display').textContent = e.target.value;
                });
            }
        }
        
        // --- EVENT HANDLERS ---
        function handleLogout() {
            localStorage.removeItem('isLoggedIn');
            window.location.href = 'login.html';
        }

        function handleToggleEditMode() {
            isTimetableEditMode = !isTimetableEditMode;
            renderPage();
        }
        
        function handleStatusChange(e) {
            const { day, id } = e.target.dataset;
            const newStatus = e.target.value;
            const lectureIndex = timetableData[day].findIndex(lec => lec.id === id);
            if (lectureIndex !== -1) {
                timetableData[day][lectureIndex].status = newStatus;
                saveData();
                renderPage();
            }
        }

        // ... (rest of the modal and calculation functions from the original file)
        function handleEditClick(e) {
            const { day, id } = e.currentTarget.dataset;
            const lecture = timetableData[day].find(lec => lec.id === id);
            if(lecture) {
                editingLectureInfo = { day, id };
                document.getElementById('modal-title').textContent = 'Edit Lecture';
                document.getElementById('modal-subject').value = lecture.subject;
                document.getElementById('modal-time').value = lecture.time;
                document.getElementById('edit-lecture-modal').classList.replace('hidden', 'flex');
            }
        }
        
        function handleAddClick(e) {
            const { day } = e.currentTarget.dataset;
            editingLectureInfo = { day, id: null };
            document.getElementById('modal-title').textContent = 'Add New Lecture';
            document.getElementById('modal-subject').value = '';
            document.getElementById('modal-time').value = '';
            document.getElementById('edit-lecture-modal').classList.replace('hidden', 'flex');
        }

        function handleDeleteClick(e) {
            deletingLectureInfo = e.currentTarget.dataset;
            document.getElementById('delete-confirm-modal').classList.replace('hidden', 'flex');
        }
        
        function handleSaveLecture() {
            const subject = document.getElementById('modal-subject').value;
            const time = document.getElementById('modal-time').value;
            if(!subject || !time) return;
            const { day, id } = editingLectureInfo;
            if (id) {
                const lectureIndex = timetableData[day].findIndex(lec => lec.id === id);
                timetableData[day][lectureIndex] = { ...timetableData[day][lectureIndex], subject, time };
            } else {
                const newLecture = { id: `${day.slice(0,3).toLowerCase()}-${Date.now()}`, subject, time, status: 'Scheduled' };
                timetableData[day].push(newLecture);
            }
            saveData();
            closeEditModal();
            renderPage();
        }
        
        function closeEditModal() {
            document.getElementById('edit-lecture-modal').classList.replace('flex', 'hidden');
            editingLectureInfo = null;
        }

        function confirmDelete() {
            const { day, id } = deletingLectureInfo;
            timetableData[day] = timetableData[day].filter(lec => lec.id !== id);
            saveData();
            closeDeleteModal();
            renderPage();
        }
        
        function closeDeleteModal() {
            document.getElementById('delete-confirm-modal').classList.replace('flex', 'hidden');
            deletingLectureInfo = null;
        }

        function handleFileChange(e) {
            const file = e.target.files[0];
            if(file) {
                document.getElementById('file-name-display').textContent = `File: ${file.name}`;
                document.getElementById('process-button-container').classList.remove('hidden');
            }
        }

        function calculateAttendance() {
            const total = parseInt(document.getElementById('calc-total').value);
            const attended = parseInt(document.getElementById('calc-attended').value);
            const required = parseFloat(document.getElementById('calc-required').value);
            const resultEl = document.getElementById('calc-result');
            
            resultEl.className = 'hidden p-4 rounded-lg text-center border';

            if (isNaN(total) || isNaN(attended) || total < attended || total < 0 || attended < 0) {
                resultEl.className = 'p-4 rounded-lg text-center border bg-red-500/20 text-red-300 border-red-500/30';
                resultEl.innerHTML = `<p class="font-semibold">Please enter valid, non-negative numbers.</p>`;
                return;
            }
            
            resultEl.classList.remove('hidden');

            const currentPercentage = total > 0 ? (attended / total) * 100 : 0;
            let message = '';

            if (currentPercentage >= required) {
                let classesToBunk = 0;
                while (((attended) / (total + classesToBunk + 1)) * 100 >= required) {
                    classesToBunk++;
                }
                resultEl.classList.add('bg-green-500/20', 'text-green-300', 'border-green-500/30');
                message = `You can safely miss ${classesToBunk} more class${classesToBunk === 1 ? '' : 'es'}.`;
            } else {
                let classesToAttend = 0;
                while (((attended + classesToAttend) / (total + classesToAttend)) * 100 < required) {
                    classesToAttend++;
                }
                resultEl.classList.add('bg-yellow-500/20', 'text-yellow-300', 'border-yellow-500/30');
                message = `You need to attend ${classesToAttend} more class${classesToAttend === 1 ? '' : 'es'}.`;
            }

            resultEl.innerHTML = `
                <p class="text-sm text-gray-400 mb-1">Current Attendance: ${currentPercentage.toFixed(2)}%</p>
                <p class="font-semibold">${message}</p>`;
        }
        
        // --- INITIAL SETUP & GLOBAL LISTENERS ---
        document.getElementById('logout-button').addEventListener('click', handleLogout);
        navButtons.forEach(btn => btn.addEventListener('click', () => showPage(btn.dataset.page)));

        document.getElementById('modal-cancel').addEventListener('click', closeEditModal);
        document.getElementById('modal-save').addEventListener('click', handleSaveLecture);
        
        document.getElementById('delete-cancel').addEventListener('click', closeDeleteModal);
        document.getElementById('delete-confirm').addEventListener('click', confirmDelete);

        // Initial load and render
        loadData();
        showPage('timetable'); // Default to timetable view on load
    });
    </script>
</body>
</html>
