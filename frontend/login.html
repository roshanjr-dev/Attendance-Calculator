<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 15px rgba(220, 38, 38, 0.4); } 50% { box-shadow: 0 0 25px rgba(220, 38, 38, 0.7); } }
        .input-glow-persistent { animation: pulse-glow 3s infinite ease-in-out; }
        .themed-background { background-color: #110d0d; background-image: radial-gradient(at 0% 100%, hsla(0, 40%, 15%, 1) 0px, transparent 50%), radial-gradient(at 90% 10%, hsla(350, 40%, 15%, 1) 0px, transparent 50%); }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; background: #DC2626; cursor: pointer; border-radius: 50%; }
        input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; background: #DC2626; cursor: pointer; border-radius: 50%; }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 font-sans themed-background">

    <div id="login-page">
        <div class="flex items-center justify-center min-h-screen">
          <div class="w-full max-w-md p-8 space-y-8 bg-gray-800 rounded-2xl shadow-lg border border-gray-700">
            <div class="text-center">
              <h2 class="mt-6 text-3xl font-extrabold text-white">Attendance Tracker</h2>
              <p class="mt-2 text-sm text-gray-400" id="auth-mode-subtitle">Sign in to manage your schedule</p>
            </div>
            <form class="mt-8 space-y-6" id="auth-form">
              <div class="relative">
                 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute top-3.5 left-4 w-5 h-5 text-gray-400"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <input id="email-input" type="email" required class="w-full pl-12 pr-4 py-3 text-white bg-gray-700/50 border border-gray-600 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition duration-300 input-glow-persistent" placeholder="Email address">
              </div>
              <div class="relative">
                 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute top-3.5 left-4 w-5 h-5 text-gray-400"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                <input id="password-input" type="password" required class="w-full pl-12 pr-4 py-3 text-white bg-gray-700/50 border border-gray-600 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition duration-300 input-glow-persistent" placeholder="Password">
              </div>
              <div class="relative hidden" id="confirm-password-field">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute top-3.5 left-4 w-5 h-5 text-gray-400"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                  <input id="confirm-password-input" type="password" class="w-full pl-12 pr-4 py-3 text-white bg-gray-700/50 border border-gray-600 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition duration-300 input-glow-persistent" placeholder="Confirm Password">
              </div>
              <p class="text-sm text-red-400 text-center" id="auth-error"></p>
              <div>
                <button type="submit" id="auth-submit-button" class="w-full py-3 font-semibold text-white bg-red-600 rounded-lg hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-800 focus:ring-red-500 transition duration-200">
                  Sign In
                </button>
              </div>
            </form>
             <p class="text-sm text-center text-gray-400">
                <span id="auth-toggle-text">Don't have an account?</span>
                <button type="button" id="auth-toggle-button" class="font-medium text-red-400 hover:text-red-300 ml-2">
                  Sign Up
                </button>
            </p>
          </div>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <nav class="bg-gray-800/80 backdrop-blur-sm border-b border-gray-700 sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                  <span class="font-bold text-xl text-white">Attendance Tracker</span>
                </div>
                <div class="hidden md:block">
                  <div class="ml-10 flex items-baseline space-x-4">
                    <button data-page="timetable" class="nav-button capitalize px-3 py-2 rounded-md text-sm font-medium transition-colors bg-gray-900 text-white">Timetable</button>
                    <button data-page="report" class="nav-button capitalize px-3 py-2 rounded-md text-sm font-medium transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">Report</button>
                    <button data-page="calculator" class="nav-button capitalize px-3 py-2 rounded-md text-sm font-medium transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">Calculator</button>
                    <button data-page="upload" class="nav-button capitalize px-3 py-2 rounded-md text-sm font-medium transition-colors text-gray-300 hover:bg-gray-700 hover:text-white">Upload</button>
                  </div>
                </div>
                <div>
                  <button id="logout-button" class="px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:bg-red-600 hover:text-white transition-colors">
                    Logout
                  </button>
                </div>
              </div>
            </div>
        </nav>
        <main id="main-content">
            </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
